name: Docker

# Builds the CPU inference image (linux/amd64 + linux/arm64) and smoke-tests it.
# `v*` tags push ghcr.io/<owner>/localdesk:<version>, :<major>.<minor> and :latest;
# a manual run pushes :edge; pull requests only build and test.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'src/**', 'pyproject.toml', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/localdesk

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the image for the runner's platform
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localdesk:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the packaged demo model
        run: |
          docker run -d --name smoke -p 127.0.0.1:8765:8765 -e LOCALDESK_API_KEY=ci-key \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            localdesk:test
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health/ready && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/v1/predictions -H 'X-API-Key: ci-key' \
            -H 'Content-Type: application/json' -d '{"text": "File share access request"}' \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); assert d["category"] == "Fileservice", d'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/model)" = 401
          docker rm -f smoke
      - name: Image tags and labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=LocalDesk
            org.opencontainers.image.description=Calibrated text classification API that abstains when unsure
            org.opencontainers.image.licenses=MIT
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
