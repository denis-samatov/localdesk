[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "localdesk-decisions"
version = "0.2.0"
description = "Calibrated text classification service with abstention, quality gates and an immutable model registry; optional Qwen/Unsloth fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.3", "build==1.3.0", "httpx2==2.13.1"]
baseline = ["scikit-learn==1.6.0", "numpy==2.2.6", "scipy==1.14.1"]
service = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[project.scripts]
localdesk = "localdesk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/localdesk"]
