[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "localdesk"
version = "0.3.1"
description = "Calibrated text classification service that abstains when unsure: quality gates, immutable model registry, CPU TF-IDF and optional Qwen/Unsloth fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Denis Samatov" }]
keywords = [
  "text-classification",
  "abstention",
  "selective-classification",
  "calibration",
  "model-registry",
  "mlops",
  "intent-detection",
  "ticket-routing",
  "fastapi",
  "unsloth",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Framework :: FastAPI",
]
# Inference with packaged or trained CPU models needs only the standard library.
dependencies = []

[project.optional-dependencies]
# Exact, tested versions live in uv.lock; ranges keep the package installable
# alongside other libraries.
dev = ["pytest==9.2.0", "ruff==0.13.3", "build==1.3.0", "httpx2==2.16.0"]
baseline = ["scikit-learn>=1.6,<2", "numpy>=1.26,<3", "scipy>=1.13,<2"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://github.com/denis-samatov/localdesk"
Documentation = "https://github.com/denis-samatov/localdesk/tree/main/docs"
Changelog = "https://github.com/denis-samatov/localdesk/blob/main/CHANGELOG.md"
Issues = "https://github.com/denis-samatov/localdesk/issues"

[project.scripts]
localdesk = "localdesk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/localdesk"]
