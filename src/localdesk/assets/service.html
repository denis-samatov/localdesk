<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalDesk · Decision Service</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#163830;font:15px system-ui,sans-serif}header{background:#173d34;color:#fff;padding:24px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px}.lang{display:flex;gap:6px}.lang button{background:transparent;border:1px solid #6f9486;padding:5px 10px;font-size:12px}.lang button[aria-pressed=true]{background:#fff;color:#173d34}.brand{font-size:23px;font-weight:700}main{max-width:1250px;margin:35px auto;padding:0 25px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,textarea,button{font:inherit;border-radius:8px;border:1px solid #c5d6ca;padding:12px}input{background:#fff}button{background:#177c5e;color:#fff;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:25px}.card{background:white;border:1px solid #d7e3d8;border-radius:14px;padding:25px}h1{font-size:34px;letter-spacing:-1px}h2{margin-top:0;font-size:20px}textarea{width:100%;height:140px;resize:vertical}.muted{color:#597368;line-height:1.65}.stats{display:flex;gap:25px;flex-wrap:wrap;margin:20px 0}.stat strong{font-size:25px;display:block}.stat span{font-size:12px;color:#597368}.bar{background:#e9eee5;height:5px;margin:5px 0 13px}.bar i{display:block;background:#148a64;height:100%}.row{display:flex;justify-content:space-between;font-size:13px}.error{color:#b0352b;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f6f8f3;padding:14px;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e3eae1;padding:9px;text-align:left}.status{font-size:12px;border-radius:20px;background:#e2f3e8;padding:6px 12px;color:#216349}label{display:block;margin-bottom:9px;font-weight:600}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><header><div class="brand">LocalDesk</div><div class="lang" role="group" aria-label="Language"><span>Decision Service</span><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button></div></header><main><h1 data-i18n="headline"></h1><p class="muted" data-i18n="intro"></p><div class="top"><input id="key" type="password" aria-label="API key" data-i18n-placeholder="keyPlaceholder" autocomplete="off"><button id="connect" data-i18n="connect"></button><span id="status" class="status" data-i18n="notLoaded"></span></div><p id="error" class="error" role="alert"></p><div class="grid"><section class="card"><h2 id="task" data-i18n="model"></h2><div id="identity" class="muted"></div><div id="stats" class="stats"></div><h3 data-i18n="labels"></h3><div id="labels" class="muted"></div><h3 data-i18n="gates"></h3><div id="gates"></div></section><section class="card"><h2 data-i18n="prediction"></h2><label for="text" data-i18n="textLabel"></label><textarea id="text" maxlength="4000" data-i18n-placeholder="textPlaceholder"></textarea><p class="muted" data-i18n="predictionNote"></p><button id="predict" disabled data-i18n="predict"></button><h3 id="choice"></h3><div id="scores"></div></section><section class="card"><h2 data-i18n="perClass"></h2><div id="classes"></div><p class="muted" data-i18n="perClassNote"></p></section><section class="card"><h2 data-i18n="plan"></h2><ol id="stages"></ol><pre id="plan" data-i18n="planEmpty"></pre></section></div><p class="muted" data-i18n="footer"></p></main><script>
const TEXT={en:{headline:'The data changes. The process stays.',intro:'Inspect the loaded model: its labels, measured quality and training plan.',keyPlaceholder:'API key (for a protected service)',connect:'Connect',notLoaded:'Model not loaded in the page',model:'Model',labels:'Task labels',gates:'Quality gates',prediction:'Prediction',textLabel:'Text for this task',textPlaceholder:'Enter a message in a language your dataset covers',predictionNote:'Each result is tied to a model version. Low confidence means a person should review it.',predict:'Classify',perClass:'Quality per class',perClassNote:'Measured on a held-out test set. These numbers do not guarantee quality on a new domain.',plan:'Training plan for this version',planEmpty:'Connect to see the plan.',footer:'The service does not store text. Training and choosing the active version are separate operator CLI commands. The API key is kept only in this page\u2019s memory.',apiError:'API error',versionChanged:'The model version changed. Connect again.',versionLine:'Version {version} \u00b7 {backend} \u00b7 {count} labels',ready:'Ready for requests',check:'Check',measured:'Measured',result:'Result',label:'Label',statusChanged:'Version changed',modelChanged:'The active model changed. Click Connect to refresh the metrics.',route:'Suggested route',review:'Needs human review'},
ru:{headline:'Данные меняются. Процесс остаётся.',intro:'Проверьте загруженную модель, её метки, измеренное качество и план обучения.',keyPlaceholder:'API key (для защищённого сервиса)',connect:'Подключиться',notLoaded:'Модель не загружена в интерфейс',model:'Модель',labels:'Метки задачи',gates:'Критерии приёмки',prediction:'Предсказание',textLabel:'Текст для выбранной задачи',textPlaceholder:'Введите сообщение на языке, проверенном вашим датасетом',predictionNote:'Результат привязан к версии модели. Низкая уверенность требует ручного разбора.',predict:'Определить категорию',perClass:'Качество по классам',perClassNote:'Метрики получены на отложенной выборке. Они не гарантируют качество на новом домене.',plan:'План обучения этой версии',planEmpty:'Подключитесь для просмотра плана.',footer:'Текст не сохраняется сервисом. Обучение и выбор рабочей версии выполняются отдельными CLI-командами оператора. API key хранится только в памяти открытой страницы.',apiError:'Ошибка API',versionChanged:'Версия модели изменилась. Подключитесь ещё раз.',versionLine:'Версия {version} \u00b7 {backend} \u00b7 {count} меток',ready:'Готов к запросам',check:'Проверка',measured:'Измерено',result:'Результат',label:'Метка',statusChanged:'Версия изменилась',modelChanged:'Рабочая модель изменилась. Нажмите Подключиться для обновления метрик.',route:'Предложенный маршрут',review:'Ручной разбор'}};
let language='en';const state={status:'notLoaded',model:null,report:null,plan:null,prediction:null};function t(key,values={}){return (TEXT[language][key]||TEXT.en[key]).replace(/\{(\w+)\}/g,(_,name)=>String(values[name]))}
const $=id=>document.getElementById(id);let token='';async function api(path,options={}){const headers={'X-API-Key':token,...options.headers};const response=await fetch(path,{...options,headers});const value=await response.json();if(!response.ok)throw Error(value.error?.message||t('apiError'));return value}function put(id,value){$(id).textContent=value}function table(target,headers,rows){const node=document.createElement('table');const head=document.createElement('tr');headers.forEach(value=>{const cell=document.createElement('th');cell.textContent=value;head.append(cell)});node.append(head);rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(value=>{const td=document.createElement('td');td.textContent=String(value);tr.append(td)});node.append(tr)});$(target).replaceChildren(node)}const pct=value=>value===null?'—':(value*100).toFixed(1)+'%';
function renderModel(){const {model,report,plan}=state;if(!model)return;put('task',model.task.id+' / '+model.task.version);put('identity',t('versionLine',{version:model.model_version,backend:model.backend,count:Object.keys(model.task.labels).length}));put('labels',Object.keys(model.task.labels).join(' · '));$('stats').replaceChildren();[['Accuracy',pct(report.classification.accuracy)],['Macro F1',pct(report.classification.macro_f1)],['Coverage',pct(report.coverage)],['Test',report.count]].forEach(([label,value])=>{const node=document.createElement('div');node.className='stat';const strong=document.createElement('strong');strong.textContent=value;const span=document.createElement('span');span.textContent=label;node.append(strong,span);$('stats').append(node)});table('gates',[t('check'),t('measured'),t('result')],Object.entries(model.quality.gates).map(([key,value])=>[key,pct(value.actual),value.passed?'PASS':'FAIL']));table('classes',[t('label'),'Precision','Recall','F1','Support'],Object.entries(report.classification.per_class).map(([key,v])=>[key,pct(v.precision),pct(v.recall),pct(v.f1),v.support]));$('stages').replaceChildren();plan.stages.forEach(stage=>{const li=document.createElement('li');li.textContent=stage;$('stages').append(li)});put('plan',JSON.stringify({backend:plan.backend,seed:plan.seed,parameters:plan.parameters,policy:plan.policy},null,2))}
function renderPrediction(){const value=state.prediction;if(!value)return;put('choice',value.category+' · '+(value.action==='route'?t('route'):t('review')));$('scores').replaceChildren();Object.entries(value.probabilities.category).sort((a,b)=>b[1]-a[1]).forEach(([label,score])=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=label;const percentage=document.createElement('span');percentage.textContent=pct(score);row.append(name,percentage);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('i');fill.style.width=pct(score);bar.append(fill);$('scores').append(row,bar)})}
function render(){document.querySelectorAll('[data-i18n]').forEach(node=>{node.textContent=t(node.dataset.i18n)});document.querySelectorAll('[data-i18n-placeholder]').forEach(node=>{node.placeholder=t(node.dataset.i18nPlaceholder)});put('status',t(state.status));renderModel();renderPrediction()}
function setLanguage(next){language=TEXT[next]?next:'en';document.documentElement.lang=language;document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));render();try{localStorage.setItem('localdesk-lang',language)}catch(_){}}
function initialLanguage(){const query=new URLSearchParams(location.search).get('lang');if(query)return query;try{return localStorage.getItem('localdesk-lang')||'en'}catch(_){return 'en'}}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));setLanguage(initialLanguage());
$('connect').onclick=async()=>{token=$('key').value;put('error','');try{const [model,report,plan]=await Promise.all([api('/v1/model'),api('/v1/model/report'),api('/v1/model/plan')]);if(report.model_version!==model.model_version||plan.model_version!==model.model_version||report.task_sha256!==model.task_sha256||plan.task_sha256!==model.task_sha256)throw Error(t('versionChanged'));Object.assign(state,{model,report,plan,prediction:null,status:'ready'});$('choice').textContent='';$('scores').replaceChildren();render();$('predict').disabled=false}catch(exception){put('error',exception.message);$('predict').disabled=true}};
$('predict').onclick=async()=>{put('error','');try{const value=await api('/v1/predictions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('text').value})});if(value.model_version!==state.model.model_version){$('predict').disabled=true;state.status='statusChanged';put('status',t('statusChanged'));throw Error(t('modelChanged'))}state.prediction=value;renderPrediction()}catch(exception){put('error',exception.message)}};
</script></body></html>
